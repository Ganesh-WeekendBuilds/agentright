name: Agent Governance

# Example: gate every push and PR on agent config governance.
# Copy this into your own repo at .github/workflows/agentright.yml

on:
  push:
    paths:
      - "**/agent*.json"
      - "**/agent*.yaml"
      - "**/*.mcp.json"
      - "**/agents.yaml"
  pull_request:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: AgentRight preflight
        uses: Ganesh-WeekendBuilds/agentright@v0
        with:
          config: ./agent-config.json
          threshold: "50"
          # fail-on-gap: critical   # uncomment to also block on any critical gap
